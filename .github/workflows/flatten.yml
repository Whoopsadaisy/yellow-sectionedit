name: Build single-file worker

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble worker
        run: cat build/sectionedit.00 build/sectionedit.01 > sectionedit.php
      - name: Validate PHP
        run: php -l sectionedit.php
      - name: Commit final layout
        run: |
          rm -rf build sectionedit-part1.php sectionedit-part2.php sectionedit-part3.php sectionedit-part4.php sectionedit-part5.php sectionedit-part6.php .github/workflows/flatten.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use single-file SectionEdit worker"
          git push
