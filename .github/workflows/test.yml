name: SectionEdit tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: php -l sectionedit.php
      - name: Section scanner regression tests
        run: php tests/sectionedit_test.php

      - name: Yellow 0.9 integration tests
        run: |
          git clone --depth 1 https://github.com/datenstrom/yellow.git /tmp/yellow
          cd /tmp/yellow
          git fetch --depth 1 origin 38e565c205f6269e27539c8b92b93b67a51bb398
          git checkout --detach 38e565c205f6269e27539c8b92b93b67a51bb398
          cd -
          export YELLOW_ROOT=/tmp/yellow
          php tests/yellow_integration_test.php

      - name: Build SectionEdit package
        run: zip -j yellow-sectionedit-0.1.28.zip sectionedit.php extension.ini
      - name: Upload SectionEdit package
        uses: actions/upload-artifact@v4
        with:
          name: yellow-sectionedit-0.1.28
          path: yellow-sectionedit-0.1.28.zip
