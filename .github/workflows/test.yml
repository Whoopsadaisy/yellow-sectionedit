name: SectionEdit tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: php -l sectionedit.php
      - name: Section scanner regression tests
        run: php tests/sectionedit_test.php
